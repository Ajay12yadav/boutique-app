# docker-compose.yml  -  Online Boutique local environment
x-service-defaults: &defaults
  restart: unless-stopped
  networks: [boutique-net]

services:
  # ---------- Data store ----------
  redis-cart:
    <<: *defaults
    image: redis:alpine
    container_name: redis-cart
    volumes:
      - redis-data:/data

  # ---------- Backend services ----------
  productcatalogservice:
    <<: *defaults
    build: ./src/productcatalogservice
    environment:
      - PORT=3550
      - DISABLE_PROFILER=1

  currencyservice:
    <<: *defaults
    build: ./src/currencyservice
    environment:
      - PORT=7000
      - DISABLE_PROFILER=1

  paymentservice:
    <<: *defaults
    build: ./src/paymentservice
    environment:
      - PORT=50051
      - DISABLE_PROFILER=1

  shippingservice:
    <<: *defaults
    build: ./src/shippingservice
    environment:
      - PORT=50051
      - DISABLE_PROFILER=1

  emailservice:
    <<: *defaults
    build: ./src/emailservice
    environment:
      - PORT=8080
      - DISABLE_PROFILER=1

  cartservice:
    <<: *defaults
    build: ./src/cartservice/src      # Dockerfile is nested one level deeper
    environment:
      - REDIS_ADDR=redis-cart:6379
    depends_on:
      - redis-cart

  recommendationservice:
    <<: *defaults
    build: ./src/recommendationservice
    environment:
      - PORT=8080
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - DISABLE_PROFILER=1
    depends_on:
      - productcatalogservice

  adservice:
    <<: *defaults
    build: ./src/adservice
    environment:
      - PORT=9555

  checkoutservice:
    <<: *defaults
    build: ./src/checkoutservice
    environment:
      - PORT=5050
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - SHIPPING_SERVICE_ADDR=shippingservice:50051
      - PAYMENT_SERVICE_ADDR=paymentservice:50051
      - EMAIL_SERVICE_ADDR=emailservice:8080
      - CURRENCY_SERVICE_ADDR=currencyservice:7000
      - CART_SERVICE_ADDR=cartservice:7070
    depends_on:
      - productcatalogservice
      - shippingservice
      - paymentservice
      - emailservice
      - currencyservice
      - cartservice

  # ---------- Frontend ----------
  frontend:
    <<: *defaults
    build: ./src/frontend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - CURRENCY_SERVICE_ADDR=currencyservice:7000
      - CART_SERVICE_ADDR=cartservice:7070
      - RECOMMENDATION_SERVICE_ADDR=recommendationservice:8080
      - SHIPPING_SERVICE_ADDR=shippingservice:50051
      - CHECKOUT_SERVICE_ADDR=checkoutservice:5050
      - AD_SERVICE_ADDR=adservice:9555
      - ENABLE_PROFILER=0
      - SHOPPING_ASSISTANT_SERVICE_ADDR=shoppingassistantservice:80
      
    depends_on:
      - productcatalogservice
      - currencyservice
      - cartservice
      - recommendationservice
      - shippingservice
      - checkoutservice
      - adservice

  # ---------- Fake traffic (start last, optional) ----------
  loadgenerator:
    <<: *defaults
    build: ./src/loadgenerator
    environment:
      - FRONTEND_ADDR=frontend:8080
      - USERS=2
    depends_on:
      - frontend
    profiles: ["load"]               # only starts when you ask for it

networks:
  boutique-net:
    driver: bridge

volumes:
  redis-data: